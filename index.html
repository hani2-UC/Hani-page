  <script>
    const viewerFile = location.pathname.endsWith("view.html") ? "view.html" : "index.html";
    let diaryPostsCache = null;

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[char]));
    }

    function escapeAttr(text) {
      return escapeHtml(text).replace(/`/g, "&#96;");
    }

    function isSafeMarkdownPath(path) {
      if (!path) return false;
      if (path.includes("://")) return false;
      if (path.startsWith("/") || path.startsWith("\\")) return false;
      if (path.includes("?") || path.includes("&")) return false;
      if (path.split("/").includes("..")) return false;
      return path.endsWith(".md");
    }

    function isRelativeAssetPath(path) {
      if (!path) return false;
      if (path.startsWith("#") || path.startsWith("/") || path.startsWith("\\")) return false;
      if (/^[a-z][a-z0-9+.-]*:/i.test(path)) return false;
      if (path.split("/").includes("..")) return false;
      return true;
    }

    function splitFrontMatter(markdown) {
      const match = String(markdown || "").match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
      if (!match) return { meta: {}, body: markdown || "" };

      const meta = {};
      match[1].split(/\r?\n/).forEach(line => {
        const pair = line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);
        if (!pair) return;
        let value = pair[2].trim();
        value = value.replace(/^["']|["']$/g, "");
        meta[pair[1]] = value;
      });

      return { meta, body: String(markdown || "").slice(match[0].length) };
    }

    function normalizePath(path) {
      const parts = [];
      String(path || "").split("/").forEach(part => {
        if (!part || part === ".") return;
        if (part === "..") parts.pop();
        else parts.push(part);
      });
      return parts.join("/");
    }

    function resolveAssetPath(currentSrc, href) {
      if (href.startsWith("/")) return href.slice(1);
      const base = currentSrc.split("/").slice(0, -1).join("/");
      return normalizePath((base ? base + "/" : "") + href);
    }

    function cleanMarkdownPath(path) {
      let cleaned = String(path || "").trim().replace(/\\/g, "/");

      // 古いリンクや相対パスの影響で、src の中に
      // diary/index.html?src=diary/xxxx.md のような値が入っても復旧する。
      for (let i = 0; i < 4; i++) {
        try {
          cleaned = decodeURIComponent(cleaned);
        } catch (e) {
          // すでに普通の文字列ならそのまま使う
        }

        const srcMark = cleaned.lastIndexOf("?src=");
        const srcMarkAmp = cleaned.lastIndexOf("&src=");
        const mark = Math.max(srcMark, srcMarkAmp);
        if (mark < 0) break;
        cleaned = cleaned.slice(mark + 5);
      }

      cleaned = cleaned.split("#")[0];
      cleaned = cleaned.replace(/^\.\//, "").replace(/^\/+/, "");
      return normalizePath(cleaned);
    }

    function pageUrl(src) {
      return "/" + viewerFile + "?src=" + encodeURIComponent(cleanMarkdownPath(src));
    }

    function resolvePostFilePath(file) {
      const cleaned = cleanMarkdownPath(file);
      if (!cleaned) return "";
      if (!cleaned.includes("/") && cleaned.endsWith(".md")) {
        return "diary/" + cleaned;
      }
      return cleaned;
    }

    function isDiaryEntryPath(path) {
      return path.startsWith("diary/")
        && path !== "diary/index.md"
        && path.endsWith(".md");
    }

    function parseInline(text) {
      let out = String(text ?? "");

      const codeStore = [];
      out = out.replace(/`([^`]+)`/g, (_, code) => {
        const key = `@@CODE${codeStore.length}@@`;
        codeStore.push(`<code>${escapeHtml(code)}</code>`);
        return key;
      });

      out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => {
        return `<img src="${escapeAttr(src.trim())}" alt="${escapeAttr(alt)}">`;
      });

      out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        return `<a href="${escapeAttr(href.trim())}">${label}</a>`;
      });

      out = out.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      out = out.replace(/(^|\s)\*([^*]+)\*/g, "$1<em>$2</em>");
      out = out.replace(/(^|\s)_([^_]+)_/g, "$1<em>$2</em>");

      codeStore.forEach((html, i) => {
        out = out.replace(`@@CODE${i}@@`, html);
      });

      return out;
    }

    function isTableSeparator(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function splitTableRow(line) {
      let trimmed = line.trim();
      if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
      if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
      return trimmed.split("|").map(cell => cell.trim());
    }

    function renderTable(lines) {
      const head = splitTableRow(lines[0]);
      const body = lines.slice(2).map(splitTableRow);
      return `<table><thead><tr>${head.map(cell => `<th>${parseInline(cell)}</th>`).join("")}</tr></thead><tbody>`
        + body.map(row => `<tr>${row.map(cell => `<td>${parseInline(cell)}</td>`).join("")}</tr>`).join("")
        + `</tbody></table>`;
    }

    function parseMarkdown(markdown) {
      const lines = String(markdown || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let i = 0;
      let paragraph = [];
      let listType = "";
      let quote = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${parseInline(paragraph.join("<br>\n"))}</p>`);
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html.push(`</${listType}>`);
        listType = "";
      }

      function flushQuote() {
        if (!quote.length) return;
        html.push(`<blockquote>${quote.map(line => `<p>${parseInline(line)}</p>`).join("")}</blockquote>`);
        quote = [];
      }

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith("```")) {
          flushParagraph(); closeList(); flushQuote();
          const code = [];
          i++;
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            code.push(lines[i]);
            i++;
          }
          html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
          i++;
          continue;
        }

        if (!trimmed) {
          flushParagraph(); closeList(); flushQuote();
          i++;
          continue;
        }

        if (trimmed.startsWith("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
          flushParagraph(); closeList(); flushQuote();
          const tableLines = [lines[i], lines[i + 1]];
          i += 2;
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            tableLines.push(lines[i]);
            i++;
          }
          html.push(renderTable(tableLines));
          continue;
        }

        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushParagraph(); closeList(); flushQuote();
          const level = heading[1].length;
          html.push(`<h${level}>${parseInline(heading[2].trim())}</h${level}>`);
          i++;
          continue;
        }

        if (/^---+$/.test(trimmed)) {
          flushParagraph(); closeList(); flushQuote();
          html.push("<hr>");
          i++;
          continue;
        }

        const list = line.match(/^\s*[-*+]\s+(.+)$/);
        if (list) {
          flushParagraph(); flushQuote();
          if (listType !== "ul") {
            closeList();
            html.push("<ul>");
            listType = "ul";
          }
          html.push(`<li>${parseInline(list[1])}</li>`);
          i++;
          continue;
        }

        const orderedList = line.match(/^\s*\d+\.\s+(.+)$/);
        if (orderedList) {
          flushParagraph(); flushQuote();
          if (listType !== "ol") {
            closeList();
            html.push("<ol>");
            listType = "ol";
          }
          html.push(`<li>${parseInline(orderedList[1])}</li>`);
          i++;
          continue;
        }

        const quoteLine = line.match(/^>\s?(.*)$/);
        if (quoteLine) {
          flushParagraph(); closeList();
          quote.push(quoteLine[1]);
          i++;
          continue;
        }

        if (trimmed.startsWith("<") && trimmed.endsWith(">")) {
          flushParagraph(); closeList(); flushQuote();
          html.push(line);
          i++;
          continue;
        }

        paragraph.push(line);
        i++;
      }

      flushParagraph(); closeList(); flushQuote();
      return html.join("\n");
    }

    async function loadDiaryPosts() {
      if (diaryPostsCache) return diaryPostsCache;

      const res = await fetch("/diary/posts.json", { cache: "no-store" });
      if (!res.ok) throw new Error("posts.json not found");
      diaryPostsCache = await res.json();
      return diaryPostsCache;
    }

    function findEmbeddedDiaryPost(posts, src) {
      const target = cleanMarkdownPath(src);
      return posts.find(post => resolvePostFilePath(post.file || post.src) === target);
    }

    function cardHtml(post) {
      const file = resolvePostFilePath(post.file || post.src);
      const title = post.title || "無題の日記";
      const date = post.date || "";
      const category = post.category || post.tag || "";
      const description = post.description || post.excerpt || "";
      let thumbnail = post.thumbnail || "";
      if (thumbnail && isRelativeAssetPath(thumbnail)) {
        thumbnail = cleanMarkdownPath(thumbnail);
      }
      const thumb = thumbnail
        ? `<div class="diary-card-thumb"><img src="${escapeHtml(thumbnail)}" alt=""></div>`
        : `<div class="diary-card-thumb diary-card-noimage">diary</div>`;

      return `
        <a class="diary-card" href="${pageUrl(file)}">
          ${thumb}
          <div class="diary-card-body">
            <div class="diary-card-meta">
              ${date ? `<span>${escapeHtml(date)}</span>` : ""}
              ${category ? `<span>${escapeHtml(category)}</span>` : ""}
            </div>
            <h2 class="diary-card-title">${escapeHtml(title)}</h2>
            ${description ? `<p class="diary-card-excerpt">${escapeHtml(description)}</p>` : ""}
          </div>
        </a>`;
    }

    async function renderDiaryIndex(md) {
      let intro = splitFrontMatter(md).body;
      intro = intro.replace(/<div class="diary-list">[\s\S]*?<\/div>\s*/g, "");
      intro = intro.replace(/##\s*最新の日記[\s\S]*?(?=\n---|$)/g, "");
      intro = intro.replace(/\[トップへ戻る\]\([^)]*\)\s*/g, "");

      try {
        const posts = await loadDiaryPosts();
        posts.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));

        const cards = posts.map(cardHtml).join("\n");
        return parseMarkdown(intro)
          + `<section class="diary-index-section">
              <div class="diary-index-head">
                <h2>記事一覧</h2>
                <span>${posts.length} entries</span>
              </div>
              <div class="diary-card-grid">${cards}</div>
            </section>`;
      } catch (e) {
        return parseMarkdown(intro)
          + `<p class="notice">日記一覧を読み込めませんでした。</p>`;
      }
    }

    async function renderMarkdown(src, markdown) {
      const parsed = splitFrontMatter(markdown);
      let md = parsed.body;

      if (src === "diary/index.md") {
        return await renderDiaryIndex(markdown);
      }

      if (isDiaryEntryPath(src)) {
        const date = parsed.meta.date || "";
        const category = parsed.meta.category || parsed.meta.tag || "";
        const title = parsed.meta.title || "";

        md = md.replace(/^\s*#\s*([0-9]{4}(?:[-/.][0-9]{1,2}){2})\s*\n?/, "");
        if (title) {
          md = md.replace(/^\s*#\s+.*\n?/, "");
        }
        md = md.replace(/<span class="meta">[\s\S]*?<\/span>\s*/i, "");

        const head = `
          <article class="diary-article">
            ${title ? `<h1>${escapeHtml(title)}</h1>` : ""}
            ${(date || category) ? `<div class="diary-date-subtle">${escapeHtml([date, category].filter(Boolean).join(" / "))}</div>` : ""}
          </article>`;

        return head + parseMarkdown(md);
      }

      return parseMarkdown(md);
    }

    function initHomeBlocks() {
      const canvas = document.getElementById("hani-blocks");
      if (!canvas) return;
      const context = canvas.getContext("2d");
      const letters = {
        H: [[0,0],[0,1],[0,2],[0,3],[0,4],[2,0],[2,1],[2,2],[2,3],[2,4],[1,2]],
        A: [[0,1],[0,2],[0,3],[0,4],[1,0],[1,2],[2,1],[2,2],[2,3],[2,4]],
        N: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,1],[1,2],[1,3],[2,0],[2,1],[2,2],[2,3],[2,4]],
        I: [[0,0],[1,0],[2,0],[1,1],[1,2],[1,3],[0,4],[1,4],[2,4]],
        M: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,1],[2,0],[2,1],[2,2],[2,3],[2,4]],
        O: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,4],[2,0],[2,1],[2,2],[2,3],[2,4]],
        E: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,2],[1,4],[2,0],[2,4]],
        ".": [[0,4]]
      };
      const palette = ["#272727", "#24c7b5", "#ffcf39", "#f06b5c", "#9d83f7"];
      let width = 0, height = 0, dpr = 1, blocks = [], dragged = null;
      let frame = 0;

      function wordTargets(word) {
        const chars = word.split("");
        const cells = [];
        let cursor = 0;
        for (const char of chars) {
          const shape = letters[char] || [];
          shape.forEach(([x, y]) => cells.push([cursor + x, y]));
          cursor += char === "." ? 1 : 4;
        }
        const cols = Math.max(cursor - 1, 1);
        const unit = Math.min(42, (width - 42) / cols, (height - 60) / 6);
        const offsetX = (width - cols * unit) / 2 + unit / 2;
        const offsetY = Math.max(30, (height - 5 * unit) / 2);
        const targets = cells.map(([x, y]) => ({ x: offsetX + x * unit, y: offsetY + y * unit }));
        while (targets.length < 79) {
          const extra = targets.length - cells.length;
          const angle = extra * 2.4;
          const radius = Math.min(width, height) * .42 + (extra % 4) * 9;
          targets.push({ x: width / 2 + Math.cos(angle) * radius, y: height / 2 + Math.sin(angle) * radius });
        }
        return targets.slice(0, 79);
      }

      function arrange(word) {
        const targets = wordTargets(word);
        blocks.forEach((block, index) => { block.target = targets[index]; });
      }

      function reset() {
        blocks = Array.from({ length: 79 }, (_, index) => ({
          x: width / 2 + (Math.random() - .5) * Math.min(width * .85, 680),
          y: height / 2 + (Math.random() - .5) * Math.min(height * .7, 290),
          vx: 0, vy: 0, color: palette[index % palette.length], blink: Math.random() * 120,
          target: { x: width / 2, y: height / 2 }
        }));
        arrange("HANI.MOE");
      }

      function roundedRect(x, y, w, h, radius) {
        context.beginPath();
        context.roundRect(x, y, w, h, radius);
      }

      function drawBlock(block, index, time) {
        const size = Math.max(21, Math.min(34, width / 26));
        const eyeOpen = (time + block.blink + index * 47) % 3100 > 110;
        context.save(); context.translate(block.x, block.y);
        roundedRect(-size / 2, -size * .42, size, size * .84, Math.max(4, size * .13));
        context.fillStyle = block.color; context.fill();
        context.fillStyle = "#f6f5ef";
        const eyeHeight = eyeOpen ? size * .12 : 2;
        roundedRect(-size * .27, -size * .12, size * .13, eyeHeight, 2); context.fill();
        roundedRect(size * .14, -size * .12, size * .13, eyeHeight, 2); context.fill();
        roundedRect(-size * .12, size * .16, size * .24, size * .08, 2); context.fill();
        context.restore();
      }

      function tick(time) {
        context.clearRect(0, 0, width, height);
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        blocks.forEach((block, index) => {
          if (block !== dragged) {
            block.vx += (block.target.x - block.x) * .052;
            block.vy += (block.target.y - block.y) * .052;
            block.vx *= .74; block.vy *= .74;
            block.x += block.vx; block.y += block.vy;
          }
          drawBlock(block, index, time);
        });
        if (!reduceMotion) frame = requestAnimationFrame(tick);
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width; height = rect.height;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!blocks.length) reset(); else arrange("HANI.MOE");
        cancelAnimationFrame(frame); tick(performance.now());
      }

      function position(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      canvas.addEventListener("pointerdown", event => {
        const pointer = position(event);
        dragged = blocks.reduce((closest, block) => {
          const distance = Math.hypot(pointer.x - block.x, pointer.y - block.y);
          return distance < closest.distance ? { block, distance } : closest;
        }, { block: null, distance: 28 }).block;
        if (dragged) { dragged.vx = dragged.vy = 0; canvas.setPointerCapture(event.pointerId); }
      });
      canvas.addEventListener("pointermove", event => {
        const pointer = position(event);
        if (dragged) { dragged.x = pointer.x; dragged.y = pointer.y; }
        else canvas.style.cursor = blocks.some(block => Math.hypot(pointer.x - block.x, pointer.y - block.y) < 24) ? "grab" : "default";
      });
      function release(event) {
        if (dragged) canvas.releasePointerCapture?.(event.pointerId);
        dragged = null;
      }
      canvas.addEventListener("pointerup", release);
      canvas.addEventListener("pointercancel", release);
      document.querySelectorAll("[data-home-word]").forEach(button => {
        button.addEventListener("click", () => {
          const word = button.dataset.homeWord;
          if (word === "RESET") reset(); else arrange(word);
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) tick(performance.now());
        });
      });
      window.addEventListener("resize", resize, { passive: true });
      resize();
    }

    function initHalBlocks() {
      const canvas = document.getElementById("hal-blocks");
      const resetButton = document.getElementById("hal-reset");
      const menuToggle = document.getElementById("hal-menu-toggle");
      const menuPanel = document.getElementById("hal-menu-panel");
      if (!canvas || !resetButton || !menuToggle || !menuPanel) return;

      const ctx = canvas.getContext("2d");
      const columns = 10;
      const rows = 8;
      const digits = {
        "0": [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[2,2],[0,3],[2,3],[0,4],[1,4],[2,4]],
        "1": [[1,0],[0,1],[1,1],[1,2],[1,3],[0,4],[1,4],[2,4]],
        "2": [[0,0],[1,0],[2,0],[2,1],[0,2],[1,2],[2,2],[0,3],[0,4],[1,4],[2,4]],
        "3": [[0,0],[1,0],[2,0],[2,1],[1,2],[2,2],[2,3],[0,4],[1,4],[2,4]],
        "4": [[0,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[2,3],[2,4]],
        "5": [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[2,2],[2,3],[0,4],[1,4],[2,4]],
        "6": [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[2,2],[0,3],[2,3],[0,4],[1,4],[2,4]],
        "7": [[0,0],[1,0],[2,0],[2,1],[2,2],[2,3],[2,4]],
        "8": [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[0,3],[2,3],[0,4],[1,4],[2,4]],
        "9": [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[2,3],[0,4],[1,4],[2,4]],
        ":": [[0,1],[0,3]]
      };
      const letters = {
        "A": [[0,1],[1,0],[2,1],[0,2],[1,2],[2,2],[0,3],[2,3],[0,4],[2,4]],
        "C": [[1,0],[2,0],[0,1],[0,2],[0,3],[1,4],[2,4]],
        "E": [[0,0],[1,0],[2,0],[0,1],[0,2],[1,2],[2,2],[0,3],[0,4],[1,4],[2,4]],
        "H": [[0,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[0,3],[2,3],[0,4],[2,4]],
        "L": [[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4]],
        "P": [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2],[0,3],[0,4]],
        "R": [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[0,3],[2,3],[0,4],[2,4]],
        "Y": [[0,0],[2,0],[0,1],[2,1],[1,2],[1,3],[1,4]],
        "!": [[1,0],[1,1],[1,2],[1,3],[1,4]],
        ".": [[1,4]],
        " ": []
      };
      let width = 0;
      let height = 0;
      let dpr = 1;
      let blocks = [];
      let grabbed = null;
      let frame = 0;
      let displayMode = "grid";
      let clockTimer = 0;
      let dragStart = null;
      let dragMoved = false;
      let motionScale = 1;
      let messageWord = "HAL LAB.";

      function build() {
        blocks = Array.from({ length: columns * rows }, (_, index) => {
          const col = Math.floor(index / rows);
          const row = index % rows;
          return { col, row, homeX: 0, homeY: 0, x: 0, y: 0, vx: 0, vy: 0, blink: Math.random() * 3500, hidden: false, released: false, pinned: false, restoreAt: 0, fallStart: 0, fallStartVelocity: 0, holdAt: 0, sproutAt: 0, sproutFromY: 0, sproutProgress: 1, layoutSize: null };
        });
        applyLayout(true);
      }

      function blockAt(col, row) {
        return blocks[col * rows + row];
      }

      function arrangeGrid(immediate = false) {
        const stepX = Math.min(78, Math.max(38, (width - 88) / (columns - 1)));
        const stepY = Math.min(64, Math.max(42, (height - 170) / (rows + 1)));
        const originX = (width - stepX * (columns - 1)) / 2;
        const originY = Math.max(72, Math.min(140, height * .16));
        blocks.forEach(block => {
          block.homeX = originX + block.col * stepX;
          block.homeY = originY + block.row * stepY;
          block.hidden = false;
          block.released = false;
          block.pinned = false;
          block.restoreAt = 0;
          block.layoutSize = null;
          if (immediate) { block.x = block.homeX; block.y = block.homeY; block.vx = block.vy = 0; }
        });
      }

      function clockTargets() {
        const now = new Date();
        const text = [now.getHours(), now.getMinutes(), now.getSeconds()].map(value => String(value).padStart(2, "0")).join(":");
        const cell = Math.max(11, Math.min(31, (width - 34) / 28, (height - 54) / 6));
        const cells = [];
        let cursor = 0;
        for (const char of text) {
          const shape = digits[char];
          shape.forEach(([x, y]) => cells.push([cursor + x, y]));
          cursor += char === ":" ? 2 : 4;
        }
        const usedWidth = Math.max(1, cursor - 1) * cell;
        const startX = (width - usedWidth) / 2 + cell / 2;
        const startY = Math.max(28, Math.min(height - 5 * cell - 28, (height - 5 * cell) / 2));
        return cells.map(([x, y]) => ({ x: startX + x * cell, y: startY + y * cell, size: Math.max(11, Math.min(34, cell * .78)) }));
      }

      function arrangeClock(immediate = false) {
        const targets = clockTargets();
        blocks.forEach((block, index) => {
          const target = targets[index];
          block.hidden = !target;
          block.released = false;
          block.pinned = false;
          block.restoreAt = 0;
          if (!target) return;
          block.homeX = target.x;
          block.homeY = target.y;
          block.layoutSize = target.size;
          if (immediate) { block.x = target.x; block.y = target.y; block.vx = block.vy = 0; }
        });
      }

      function messageTargets(word) {
        const cell = Math.max(12, Math.min(34, (width - 40) / Math.max(8, word.length * 4), (height - 54) / 6));
        const cells = [];
        let cursor = 0;
        for (const char of word) {
          const shape = letters[char] || [];
          shape.forEach(([x, y]) => cells.push([cursor + x, y]));
          cursor += char === " " ? 2 : 4;
        }
        const usedWidth = Math.max(1, cursor - 1) * cell;
        const startX = (width - usedWidth) / 2 + cell / 2;
        const startY = Math.max(28, Math.min(height - 5 * cell - 28, (height - 5 * cell) / 2));
        return cells.map(([x, y]) => ({ x: startX + x * cell, y: startY + y * cell, size: Math.max(12, Math.min(35, cell * .8)) }));
      }

      function arrangeMessage(immediate = false) {
        const targets = messageTargets(messageWord);
        blocks.forEach((block, index) => {
          const target = targets[index];
          block.hidden = !target;
          block.released = false;
          block.pinned = false;
          block.restoreAt = 0;
          if (!target) return;
          block.homeX = target.x;
          block.homeY = target.y;
          block.layoutSize = target.size;
          if (immediate) { block.x = target.x; block.y = target.y; block.vx = block.vy = 0; }
        });
      }

      function applyLayout(immediate = false) {
        if (displayMode === "clock") arrangeClock(immediate);
        else if (displayMode === "message") arrangeMessage(immediate);
        else arrangeGrid(immediate);
      }

      function setDisplayMode(mode, word = "") {
        displayMode = mode;
        if (word) messageWord = word;
        window.clearInterval(clockTimer);
        clockTimer = 0;
        applyLayout(false);
        if (mode === "clock") clockTimer = window.setInterval(() => arrangeClock(false), 1000);
      }

      function releaseColumnFrom(block) {
        const now = performance.now();
        const restoreAt = now + 5000;
        for (let row = block.row; row < rows; row++) {
          const child = blockAt(block.col, row);
          if (!child || child.hidden) continue;
          child.released = true;
          child.pinned = false;
          // Rebuild the hanging column from its top, one face at a time.
          child.restoreAt = restoreAt + (row - block.row) * 135;
          child.sproutAt = 0;
          child.sproutProgress = 0;
          child.fallStart = now;
          child.fallStartVelocity = Math.max(0, Math.min(4, child.vy));
          child.vx = (child.x - width / 2) * .015;
          child.vy = child.fallStartVelocity;
        }
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        build();
      }

      function roundRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }

      function drawFace(block, time) {
        const size = block.layoutSize || Math.max(24, Math.min(42, width / 28));
        const pulling = grabbed === block;
        const blink = (time + block.blink) % 3600 < 95;
        ctx.save();
        ctx.translate(block.x, block.y);
        // Only the returning block grows vertically. Falling blocks retain
        // their normal proportions all the way down.
        ctx.scale(1, block.sproutAt ? .18 + .82 * block.sproutProgress : 1);
        roundRect(-size / 2, -size * .42, size, size * .84, Math.max(4, size * .13));
        ctx.fillStyle = pulling ? "#1ebfac" : (block.released ? "#f06b5c" : "#303030");
        ctx.fill();
        ctx.fillStyle = "#f5f5f0";
        const eyeH = block.pinned || blink ? 2 : size * .12;
        roundRect(-size * .28, -size * .12, size * .13, eyeH, 2); ctx.fill();
        roundRect(size * .15, -size * .12, size * .13, eyeH, 2); ctx.fill();
        roundRect(-size * .12, size * .17, size * .24, pulling ? size * .17 : (block.pinned ? size * .13 : size * .07), 2); ctx.fill();
        ctx.restore();
      }

      function blockHalfHeight(block) {
        const size = block.layoutSize || Math.max(24, Math.min(42, width / 28));
        return size * .42;
      }

      function tick(time) {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#353535";
        ctx.lineWidth = 1.5;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (grabbed && !grabbed.pinned && !dragMoved && time >= grabbed.holdAt) {
          grabbed.pinned = true;
          grabbed.vx = grabbed.vy = 0;
        }

        blocks.forEach(block => {
          if (block.hidden) return;
          if (block.released) {
            if (time >= block.restoreAt) {
              block.released = false;
              block.sproutAt = time;
              block.sproutFromY = block.homeY + blockHalfHeight(block) * .95;
              block.x = block.homeX;
              block.y = block.sproutFromY;
              block.vx = block.vy = 0;
            } else {
              const t = Math.min(1, (time - block.fallStart) / 1150);
              const eased = 1 - Math.cos(t * Math.PI / 2);
              block.vy = block.fallStartVelocity + (9 - block.fallStartVelocity) * eased;
              block.vx *= .99;
              block.x += block.vx * motionScale;
              block.y += block.vy * motionScale;
              return;
            }
          }
          if (block.sproutAt) {
            const progress = Math.min(1, (time - block.sproutAt) / 380);
            const eased = 1 - Math.pow(1 - progress, 3);
            block.sproutProgress = eased;
            block.x = block.homeX;
            block.y = block.sproutFromY + (block.homeY - block.sproutFromY) * eased;
            if (progress < 1) return;
            block.sproutAt = 0;
            block.sproutProgress = 1;
            block.y = block.homeY;
          }
          if (block !== grabbed && !block.pinned) {
            const parent = displayMode === "grid" && block.row ? blockAt(block.col, block.row - 1) : null;
            const desiredX = block.homeX + (parent ? (parent.x - parent.homeX) * .18 : 0);
            const desiredY = block.homeY + (parent ? (parent.y - parent.homeY) * .18 : 0);
            block.vx += (desiredX - block.x) * .055 * motionScale;
            block.vy += (desiredY - block.y) * .055 * motionScale;
            block.vx *= .76;
            block.vy *= .76;
            block.x += block.vx * motionScale;
            block.y += block.vy * motionScale;
          }
        });

        if (displayMode === "grid" || displayMode === "clock") blocks.forEach(block => {
          // Let the face appear first; the string follows near the end of
          // the sprout so it never looks as though it appeared by itself.
          if (block.hidden || block.released || (block.sproutAt && block.sproutProgress < .84)) return;
          // The grid hangs from the block above it. Clock characters keep a
          // clean, direct string to the ceiling at their own x position.
          const parent = displayMode === "grid" && block.row ? blockAt(block.col, block.row - 1) : null;
          if (parent?.released || parent?.hidden) return;
          const fromX = parent ? parent.x : block.homeX;
          const fromY = parent ? parent.y + blockHalfHeight(parent) : 0;
          ctx.beginPath();
          ctx.moveTo(fromX, fromY);
          ctx.lineTo(block.x, block.y - blockHalfHeight(block));
          ctx.stroke();
        });
        blocks.forEach(block => { if (!block.hidden) drawFace(block, time); });
        if (!reduceMotion) frame = requestAnimationFrame(tick);
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      canvas.addEventListener("pointerdown", event => {
        const point = pointerPosition(event);
        dragStart = point;
        dragMoved = false;
        grabbed = blocks.reduce((nearest, block) => {
          const distance = Math.hypot(point.x - block.x, point.y - block.y);
          return !block.hidden && !block.released && distance < nearest.distance ? { block, distance } : nearest;
        }, { block: null, distance: 32 }).block;
        if (grabbed) {
          // A fixed block is released by picking it up again. Ordinary drags
          // never become fixed merely because the pointer is released.
          if (grabbed.pinned) grabbed.pinned = false;
          grabbed.holdAt = performance.now() + 300;
          canvas.setPointerCapture(event.pointerId);
        }
      });
      canvas.addEventListener("pointermove", event => {
        const point = pointerPosition(event);
        if (grabbed) {
          grabbed.x = point.x;
          grabbed.y = point.y;
          grabbed.vx = grabbed.vy = 0;
          dragMoved ||= Math.hypot(point.x - dragStart.x, point.y - dragStart.y) > 3;
          if (dragMoved && !grabbed.pinned) grabbed.holdAt = performance.now() + 300;
          const releaseDistance = Math.min(600, Math.max(300, width * .38));
          if (Math.hypot(point.x - grabbed.homeX, point.y - grabbed.homeY) > releaseDistance) {
            releaseColumnFrom(grabbed);
            canvas.releasePointerCapture?.(event.pointerId);
            grabbed = null;
          }
        } else {
          canvas.style.cursor = blocks.some(block => !block.hidden && !block.released && Math.hypot(point.x - block.x, point.y - block.y) < 28) ? "grab" : "default";
        }
      });
      function release(event) {
        if (grabbed) {
          canvas.releasePointerCapture?.(event.pointerId);
        }
        grabbed = null;
        dragStart = null;
        dragMoved = false;
      }
      canvas.addEventListener("pointerup", release);
      canvas.addEventListener("pointercancel", release);
      resetButton.addEventListener("click", () => {
        applyLayout(true);
        cancelAnimationFrame(frame);
        tick(performance.now());
      });
      menuToggle.addEventListener("click", () => {
        const open = menuPanel.hidden;
        menuPanel.hidden = !open;
        menuToggle.setAttribute("aria-expanded", String(open));
      });
      document.querySelectorAll("[data-hal-layout]").forEach(button => {
        button.addEventListener("click", () => {
          setDisplayMode(button.dataset.halLayout, button.dataset.halWord);
          menuPanel.hidden = true;
          menuToggle.setAttribute("aria-expanded", "false");
        });
      });
      document.querySelectorAll("[data-hal-speed]").forEach(button => {
        button.addEventListener("click", () => {
          const slow = motionScale === 1;
          motionScale = slow ? .38 : 1;
          button.setAttribute("aria-pressed", String(slow));
          button.textContent = slow ? "通常の速さに戻す" : "動きをゆっくり";
        });
      });
      window.addEventListener("resize", () => {
        resize();
        cancelAnimationFrame(frame);
        tick(performance.now());
      }, { passive: true });
      resize();
      tick(performance.now());
    }

    function rewriteMarkdownLinks(currentSrc) {
      document.querySelectorAll("#content a").forEach(a => {
        const href = a.getAttribute("href");
        if (!href) return;
        if (href.startsWith("#") || href.startsWith("mailto:") || /^[a-z][a-z0-9+.-]*:/i.test(href)) return;

        // すでに index.html?src=... / view.html?src=... の形になっているリンクは、
        // Markdown本文へのリンクではなく「表示用ページへのリンク」なので二重変換しない。
        if (href.includes("?")) return;

        const hashIndex = href.indexOf("#");
        const pathPart = hashIndex >= 0 ? href.slice(0, hashIndex) : href;
        const hashPart = hashIndex >= 0 ? href.slice(hashIndex) : "";

        if (pathPart.endsWith(".md")) {
          const resolved = resolveAssetPath(currentSrc, pathPart);
          if (isSafeMarkdownPath(resolved)) {
            a.setAttribute("href", pageUrl(resolved) + hashPart);
          }
        }
      });
    }

    function rewriteRelativeImages(currentSrc) {
      document.querySelectorAll("#content img").forEach(img => {
        const src = img.getAttribute("src");
        if (!isRelativeAssetPath(src)) return;
        img.setAttribute("src", resolveAssetPath(currentSrc, src));
        img.addEventListener("error", () => {
          img.classList.add("image-missing");
          img.setAttribute("alt", "");
        }, { once: true });
      });
    }

    function rawMarkdownUrl(src) {
      return "/" + encodeURI(src) + "?raw=1";
    }

    async function fetchMarkdownFile(src) {
      const candidates = Array.from(new Set([rawMarkdownUrl(src), "/" + src, "/" + encodeURI(src)]));
      for (const url of candidates) {
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) return await res.text();
      }
      throw new Error("not found");
    }

    async function loadPageMarkdown(src) {
      const key = cleanMarkdownPath(src);
      return await fetchMarkdownFile(key);
    }

    async function main() {
      const params = new URLSearchParams(location.search);
      const src = cleanMarkdownPath(params.get("src") || "index.md");
      const content = document.getElementById("content");

      if (src === "diary.md" || src.startsWith("diary/")) {
        location.replace("/");
        return;
      }

      if (!isSafeMarkdownPath(src)) {
        content.textContent = "読み込めないパスです。";
        return;
      }

      try {
        const md = await loadPageMarkdown(src);
        const isHome = src === "index.md";
        document.body.classList.toggle("home-page", isHome);
        content.classList.toggle("home-content", isHome);
        content.innerHTML = isHome ? renderHome() : await renderMarkdown(src, md);
        document.getElementById("raw-link").href = rawMarkdownUrl(src);
        if (isHome) initHalBlocks();
        else {
          rewriteMarkdownLinks(src);
          rewriteRelativeImages(src);
        }
      } catch (e) {
        content.textContent = "Markdownを読み込めませんでした。.md ファイルがアップロードされているか確認してください: " + src;
      }
    }
const backToTopButton = document.getElementById("back-to-top");

function updateBackToTopButton() {
  if (!backToTopButton) return;

  backToTopButton.classList.toggle("is-visible", window.scrollY > 320);
}

if (backToTopButton) {
  window.addEventListener("scroll", updateBackToTopButton, { passive: true });

  backToTopButton.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });

  updateBackToTopButton();
}
    main();
  </script>
</body>
